[options]
RootDir = /
DBPath = /var/lib/pacman/
CacheDir = /var/cache/pacman/pkg/
LogFile = /var/log/pacman.log
GPGDir = /etc/pacman.d/gnupg/
HookDir = /etc/pacman.d/hooks/
Architecture = riscv64

# This WaterOS build omits GPGME, so pacman has no signature feature and its
# corresponding SigLevel directives must be absent. HTTPS transport remains
# enabled; do not use packages from an untrusted repository.

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
