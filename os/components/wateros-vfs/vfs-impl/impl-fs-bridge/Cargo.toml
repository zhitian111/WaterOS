[package]
    name = "wateros-vfs-impl-fs-bridge"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "../../vfs-api/api-v0/", package = "wateros-vfs-api-v0", default-features = true }
    driver-block-api-v0 = { path = "../../../wateros-driver/driver-block/block-api/api-v0", package = "wateros-driver-block-api-v0", default-features = true }
    fs = { path = "../../../wateros-fs/", package = "wateros-fs", default-features = true, optional = true }
    spin = { version = "0.10.0", default-features = false, features = [
        "mutex",
        "spin_mutex",
    ] }
    log = { version = "0.4" }
    impl_page_cache = { path = "../impl-page-cache/", package = "wateros-vfs-impl-page-cache", default-features = true, optional = true }
    impl_fd_session = { path = "../impl-fd-session/", package = "wateros-vfs-impl-fd-session", default-features = true, optional = true }
    task = { path = "../../../wateros-task/", package = "wateros-task", default-features = false }
    wateros-base-config = { path = "../../../wateros-base/base-config", package = "wateros-base-config" }
    base = { path = "../../../wateros-base/", package = "wateros-base", default-features = true }

[features]
    # 本 crate 被选中构建时默认带 `fs`，便于工作区 `cargo check`；聚合层仍通过 optional dep 控制是否拉取本 crate。
    api-v0 = [  ]
    bridge-fs-api = [ "dep:fs", "dep:impl_fd_session", "dep:impl_page_cache", "task/api-v0", "task/impl-core" ]
    default = [ "api-v0", "bridge-fs-api" ]
