[package]
    name = "wateros-vfs-impl-fd-session"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "../../vfs-api/api-v0/", package = "wateros-vfs-api-v0", default-features = true }
    base = { path = "../../../wateros-base/", package = "wateros-base", default-features = true }
    console = { path = "../../../wateros-runtime/runtime-console/", package = "wateros-runtime-console", default-features = false }
    driver-api = { path = "../../../wateros-driver/driver-api/api-v0/", package = "wateros-driver-api-v0", default-features = true }
    driver-character-api-v0 = { path = "../../../wateros-driver/driver-character/character-api/api-v0", package = "wateros-driver-character-api-v0", default-features = true }
    ipc = { path = "../../../wateros-ipc/", package = "wateros-ipc", default-features = false }
    arch = { path = "../../../wateros-platform/platform-arch/", package = "wateros-platform-arch", default-features = false, features = [
        "api-v0",
    ] }
    waitqueue = { path = "../../../wateros-ipc/ipc-waitqueue/", package = "ipc-waitqueue", default-features = false }
    spin = { version = "0.10.0", default-features = false, features = [
        "mutex",
        "spin_mutex",
    ] }
    task = { path = "../../../wateros-task/", package = "wateros-task", default-features = false }

[features]
    api-v0 = [  ]
    default = [ "impl-fd-session" ]
    impl-fd-session = [
        "api-v0",
        "ipc/pipe",
        "task/api-v0",
        "task/impl-core",
        "waitqueue/impl-task",
    ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
