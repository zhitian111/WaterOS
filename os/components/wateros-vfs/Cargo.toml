[workspace]
    members = [ "./vfs-api/api-v0/", "./vfs-impl/impl-dummy/" ]
[package]
    name = "wateros-vfs"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./vfs-api/api-v0/", package = "wateros-vfs-api-v0", default-features = true }
    impl-dummy = { path = "./vfs-impl/impl-dummy/", package = "wateros-vfs-impl-dummy", default-features = true }
    impl-fs-bridge = { path = "./vfs-impl/impl-fs-bridge/", package = "wateros-vfs-impl-fs-bridge", default-features = true, optional = true }

[features]
    api-v0 = [ "impl-dummy/api-v0", "impl-fs-bridge?/api-v0" ]
    bridge-fs-api = [ "dep:impl-fs-bridge", "impl-fs-bridge/bridge-fs-api" ]
    default = [ "api-v0", "bridge-fs-api" ]
    impl-dummy = [  ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
