[package]
    name = "ipc-waitqueue"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./waitqueue-api/api-v0/", package = "wateros-ipc-waitqueue-api-v0", default-features = true, optional = true }
    impl-task = { path = "./waitqueue-impl/impl-task/", package = "wateros-ipc-waitqueue-impl-task", default-features = false, optional = true }

[features]
    api-v0 = [ "dep:api-v0", "impl-task?/api-v0" ]
    default = [  ]
    impl-loongarch64 = [ "api-v0", "impl-task", "impl-task/impl-loongarch64" ]
    impl-riscv64 = [ "api-v0", "impl-task", "impl-task/impl-riscv64" ]
    impl-task = [ "api-v0", "dep:impl-task" ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
