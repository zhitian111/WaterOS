[workspace]
    members = [ "./pipe-api/api-v0/", "./pipe-impl/impl-dummy/" ]
[package]
    name = "ipc-pipe"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./pipe-api/api-v0/", package = "wateros-ipc-pipe-api-v0", default-features = true }
    impl-dummy = { path = "./pipe-impl/impl-dummy/", package = "wateros-ipc-pipe-impl-dummy", default-features = true }

[features]
    api-v0 = [ "impl-dummy/api-v0" ]
    default = [ "api-v0", "impl-dummy" ]
    impl-dummy = [  ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
