[workspace]
    members = [
        "./ipc-api/api-v0/",
        "./ipc-futex/",
        "./ipc-futex/futex-api/api-v0/",
        "./ipc-futex/futex-impl/impl-task/",
        "./ipc-pipe/",
        "./ipc-pipe/pipe-api/api-v0/",
        "./ipc-pipe/pipe-impl/impl-ringbuf/",
        "./ipc-shm/",
        "./ipc-shm/shm-api/api-v0/",
        "./ipc-shm/shm-impl/impl-frame/",
        "./ipc-signal/",
        "./ipc-signal/signal-api/api-v0/",
        "./ipc-signal/signal-impl/impl-core/",
        "./ipc-waitqueue/",
        "./ipc-waitqueue/waitqueue-api/api-v0/",
        "./ipc-waitqueue/waitqueue-impl/impl-task/",
    ]
[package]
    name = "wateros-ipc"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./ipc-api/api-v0/", package = "wateros-ipc-api-v0", default-features = true }
    futex = { path = "./ipc-futex/", package = "ipc-futex", default-features = false, optional = true }
    pipe = { path = "./ipc-pipe/", package = "ipc-pipe", default-features = false, optional = true }
    shm = { path = "./ipc-shm/", package = "ipc-shm", default-features = false, optional = true }
    signal = { path = "./ipc-signal/", package = "ipc-signal", default-features = false, optional = true }
    waitqueue = { path = "./ipc-waitqueue/", package = "ipc-waitqueue", default-features = true }
    log = { version = "0.4.29" }

[features]
    self_test = [ "pipe" ]
    all = [ "api-v0", "futex", "pipe", "shm", "signal" ]
    api-v0 = [  ]
    default = [ "api-v0" ]
    futex = [ "dep:futex", "futex/api-v0" ]
    pipe = [ "dep:pipe", "pipe/api-v0", "pipe/impl-ringbuf" ]
    shm = [ "dep:shm", "shm/api-v0", "shm/impl-frame" ]
    signal = [ "dep:signal", "signal/api-v0" ]
[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
