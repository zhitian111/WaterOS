[package]
    name = "ipc-futex"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./futex-api/api-v0/", package = "wateros-ipc-futex-api-v0", default-features = true }
    impl-dummy = { path = "./futex-impl/impl-dummy/", package = "wateros-ipc-futex-impl-dummy", default-features = true }

[features]
    api-v0 = [ "impl-dummy/api-v0" ]
    default = [ "api-v0", "impl-dummy" ]
    impl-dummy = [  ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
