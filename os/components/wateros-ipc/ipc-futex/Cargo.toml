[package]
    name = "ipc-futex"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./futex-api/api-v0/", package = "wateros-ipc-futex-api-v0", default-features = true }
    impl-task = { path = "./futex-impl/impl-task/", package = "wateros-ipc-futex-impl-task", default-features = true }
    log = "0.4"

[features]
    api-v0 = []
    self_test = [ "impl-task/self_test" ]
    default = [ "api-v0" ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
