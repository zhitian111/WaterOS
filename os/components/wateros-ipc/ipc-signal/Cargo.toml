[package]
name = "ipc-signal"
version = "0.1.0"
edition = "2024"

[dependencies]
api-v0 = { path = "./signal-api/api-v0/", package = "wateros-ipc-signal-api-v0", default-features = true }
impl-core = { path = "./signal-impl/impl-core/", package = "wateros-ipc-signal-impl-core", default-features = true }
log = "0.4"

[features]
api-v0 = []
self_test = [ "impl-core/self_test" ]
default = [ "api-v0" ]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
