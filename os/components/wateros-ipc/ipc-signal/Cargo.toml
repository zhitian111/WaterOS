[workspace]
    members = [ "./signal-api/api-v0/", "./signal-impl/impl-dummy/" ]
[package]
    name = "ipc-signal"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./signal-api/api-v0/", package = "wateros-ipc-signal-api-v0", default-features = true }
    impl-dummy = { path = "./signal-impl/impl-dummy/", package = "wateros-ipc-signal-impl-dummy", default-features = true, optional = true }
    spin = "0.10.0"

[features]
    api-v0 = [ "impl-dummy?/api-v0" ]
    default = [ "api-v0" ]
    impl-dummy = [ "dep:impl-dummy" ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
