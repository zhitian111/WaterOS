[package]
name = "wateros-tty-impl-console"
version = "0.1.0"
edition = "2024"

[dependencies]
api-v0 = { path = "../../tty-api/api-v0/", package = "wateros-tty-api-v0", default-features = true }
waitqueue = { path = "../../../wateros-ipc/ipc-waitqueue/", package = "ipc-waitqueue", default-features = false, features = ["impl-task"] }
spin = { version = "0.10.0", default-features = false, features = ["mutex", "spin_mutex"] }

[features]
self_test = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
