[workspace]
members = ["./tty-api/api-v0/", "./tty-impl/impl-console/"]

[package]
name = "wateros-tty"
version = "0.1.0"
edition = "2024"

[dependencies]
api-v0 = { path = "./tty-api/api-v0/", package = "wateros-tty-api-v0", default-features = true, optional = true }
impl-console = { path = "./tty-impl/impl-console/", package = "wateros-tty-impl-console", default-features = true, optional = true }

[features]
api-v0 = ["dep:api-v0", "api-v0/api-v0"]
default = ["api-v0", "impl-console"]
impl-console = ["api-v0", "dep:impl-console"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
