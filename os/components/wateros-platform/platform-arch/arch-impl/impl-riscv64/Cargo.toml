[package]
    name = "wateros-platform-arch-impl-riscv64"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "../../arch-api/api-v0/", package = "wateros-platform-arch-api-v0", default-features = true }
    abi = { path = "../../../../wateros-abi/", package = "wateros-abi", default-features = true }
    firmware = { path = "../../../platform-firmware/", package = "wateros-platform-firmware", default-features = true }
    logging = {path = "../../../../wateros-runtime/runtime-logging/", package = "wateros-runtime-logging", default-features = true}
    riscv = {version = "0.16.0" }
    task = { path = "../../../../wateros-task/", package = "wateros-task", default-features = true }

[features]
    api-v0 = [  ]
    default = [ "api-v0" ]
