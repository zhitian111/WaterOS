[package]
    name = "wateros-platform-impl-loongson2k1000la"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "../../platform-api/api-v0/", package = "wateros-platform-api-v0", default-features = true }
    base = { path = "../../../wateros-base/", package = "wateros-base", default-features = true }
    fdt = "0.1.5"
    log = "0.4"

[target.'cfg(target_arch = "loongarch64")'.dependencies]
    irq-loongarch = { version = "0.1.1-pre.1", features = [ "liointc" ] }

[features]
    api-v0 = [  ]
    default = [ "api-v0" ]
    self_test = [ ]
