[workspace]
    members = [
        "./platform-api/api-v0/",
        "./platform-arch/",
        "./platform-arch/arch-api/api-v0/",
        "./platform-arch/arch-impl/impl-dummy/",
        "./platform-arch/arch-impl/impl-riscv64/",
        "./platform-firmware/",
        "./platform-firmware/firmware-api/api-v0/",
        "./platform-firmware/firmware-impl/impl-dummy/",
        "./platform-firmware/firmware-impl/impl-opensbi/",
        "./platform-impl/impl-dummy/",
        "./platform-impl/impl-qemu-riscv64-opensbi/",
    ]
[package]
    name = "wateros-platform"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./platform-api/api-v0/", package = "wateros-platform-api-v0", default-features = true }
    impl-dummy = { path = "./platform-impl/impl-dummy/", package = "wateros-platform-impl-dummy", default-features = true }
    impl-qemu-riscv64-opensbi = { path = "./platform-impl/impl-qemu-riscv64-opensbi/", package = "wateros-platform-impl-qemu-riscv64-opensbi", default-features = true }
    arch = { path = "./platform-arch/", package = "wateros-platform-arch", default-features = true }
    firmware = { path = "./platform-firmware/", package = "wateros-platform-firmware", default-features = true }

[features]
    api-v0 = [
        "arch/api-v0",
        "firmware/api-v0",
        "impl-dummy/api-v0",
        "impl-qemu-riscv64-opensbi/api-v0",
    ]
    default = [ "api-v0", "impl-qemu-riscv64-opensbi" ]
    impl-dummy = [  ]
    impl-qemu-riscv64-opensbi = [ "opensbi" ]
    opensbi = [ "firmware/impl-opensbi" ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
