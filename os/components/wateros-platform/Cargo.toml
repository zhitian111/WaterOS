[workspace]
    members = [
        "./platform-api/api-v0/",
        "./platform-arch/",
        "./platform-arch/arch-api/api-v0/",
        "./platform-arch/arch-impl/impl-dummy/",
        "./platform-arch/arch-impl/impl-loongarch64/",
        "./platform-arch/arch-impl/impl-riscv64/",
        "./platform-firmware/",
        "./platform-firmware/firmware-api/api-v0/",
        "./platform-firmware/firmware-impl/impl-dummy/",
        "./platform-firmware/firmware-impl/impl-qemu-loongarch64-uart16550/",
        "./platform-firmware/firmware-impl/impl-riscv64-opensbi/",
        "./platform-impl/impl-dummy/",
        "./platform-impl/impl-qemu-loongarch64-virt/",
        "./platform-impl/impl-qemu-riscv64-opensbi/",
    ]
[package]
    name = "wateros-platform"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./platform-api/api-v0/", package = "wateros-platform-api-v0", default-features = false }
    impl-dummy = { path = "./platform-impl/impl-dummy/", package = "wateros-platform-impl-dummy", default-features = false, optional = true }
    impl-qemu-loongarch64-virt = { path = "./platform-impl/impl-qemu-loongarch64-virt/", package = "wateros-platform-impl-qemu-loongarch64-virt", default-features = true, optional = true }
    impl-qemu-riscv64-opensbi = { path = "./platform-impl/impl-qemu-riscv64-opensbi/", package = "wateros-platform-impl-qemu-riscv64-opensbi", default-features = false, optional = true }
    arch = { path = "./platform-arch/", package = "wateros-platform-arch", default-features = false }
    firmware = { path = "./platform-firmware/", package = "wateros-platform-firmware", default-features = false }
    logging = {path = "../wateros-runtime/runtime-logging/", package = "wateros-runtime-logging", default-features = false}

[features]
    api-v0 = [
        "arch/api-v0",
        "firmware/api-v0",
        "impl-dummy?/api-v0",
        "impl-qemu-loongarch64-virt?/api-v0",
        "impl-qemu-riscv64-opensbi?/api-v0",
    ]
    default = [ "api-v0", "impl-qemu-riscv64-opensbi" ]
    impl-dummy = [ "dep:impl-dummy" ]
    impl-qemu-loongarch64-virt = [
        "api-v0",
        "dep:impl-qemu-loongarch64-virt",
        "arch/impl-loongarch64",
        "firmware/impl-qemu-loongarch64-uart16550",
        "logging/impl-firmware-console",
    ]
    impl-qemu-riscv64-opensbi = [
        "api-v0",
        "dep:impl-qemu-riscv64-opensbi",
        "arch/impl-riscv64",
        "logging/impl-firmware-opensbi",
        "firmware/impl-riscv64-opensbi",
    ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
