[package]
    name = "wateros-driver-impl-qemu-riscv64-opensbi"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    log = { version = "0.4.29" }
    spin = "0.10.0"
    common = { path = "../impl-common", package = "wateros-driver-impl-common", default-features = true }
    wateros-driver-character-api-v0 = { path = "../../driver-character/character-api/api-v0", package = "wateros-driver-character-api-v0", default-features = true }
    api-v0 = { path = "../../driver-api/api-v0", package = "wateros-driver-api-v0", default-features = true }
    block = { path = "../../driver-block", package = "wateros-driver-block", default-features = true, features = [
        "api-v0",
        "impl-virtio-mmio",
    ] }
    character = { path = "../../driver-character", package = "wateros-driver-character", default-features = true, features = [
        "impl-rtc-stub",
        "impl-uart-16550",
    ] }
    network = { path = "../../driver-network", package = "wateros-driver-network", default-features = true, features = [
        "api-v0",
        "impl-virtio-mmio",
    ] }
    display = { path = "../../driver-display", package = "wateros-driver-display", default-features = false, optional = true, features = [
        "api-v0",
        "impl-virtio-mmio",
    ] }
    input = { path = "../../driver-input", package = "wateros-driver-input", default-features = false, optional = true, features = [
        "api-v0",
        "impl-virtio-mmio",
    ] }
    fs = { path = "../../../wateros-fs", package = "wateros-fs", default-features = true }
    wateros-base-config = { path = "../../../wateros-base/base-config", package = "wateros-base-config" }
    platform = { path = "../../../wateros-platform", package = "wateros-platform", default-features = false, features = [ "impl-qemu-riscv64-opensbi" ] }

[features]
    api-v0 = [  ]
    block-cache = [ "block/impl-block-cache" ]
    default = [ "api-v0" ]
    display = [ "dep:display" ]
    input = [ "dep:input" ]
