[package]
name = "wateros-driver-impl-qemu-riscv64-opensbi"
version = "0.1.0"
edition = "2024"

[dependencies]
fdt = "0.1.5"
logging = { path = "../../../wateros-runtime/runtime-logging", package = "wateros-runtime-logging", default-features = true }
spin = "0.10.0"
virtio-drivers = "0.13.0"
api-v0 = { path = "../../driver-api/api-v0", package = "wateros-driver-api-v0", default-features = true }
block-api-v0 = { path = "../../driver-block/block-api/api-v0", package = "wateros-driver-block-api-v0", default-features = true }
fs = { path = "../../../wateros-fs", package = "wateros-fs", default-features = true }

[features]
default = ["api-v0"]
api-v0 = []
