[package]
name = "wateros-driver-impl-loongson2k1000la"
version = "0.1.0"
edition = "2024"

[dependencies]
api-v0 = { path = "../../driver-api/api-v0", package = "wateros-driver-api-v0" }
common = { path = "../impl-common", package = "wateros-driver-impl-common" }
dw-mmc = { path = "../../driver-block/block-impl/impl-dw-mmc", package = "wateros-driver-block-impl-dw-mmc" }
fdt = "0.1.5"
log = "0.4.29"
spin = "0.10.0"

[target.'cfg(target_arch = "loongarch64")'.dependencies]
platform = { path = "../../../wateros-platform", package = "wateros-platform", default-features = false, features = ["impl-loongson2k1000la"] }

[features]
api-v0 = []
default = ["api-v0"]
