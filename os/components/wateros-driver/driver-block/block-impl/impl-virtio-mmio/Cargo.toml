[package]
    name = "wateros-driver-block-impl-virtio-mmio"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "../../block-api/api-v0/", package = "wateros-driver-block-api-v0", default-features = true }
    driver-api = { path = "../../../driver-api/api-v0", package = "wateros-driver-api-v0", default-features = true }
    frame_alloctor = { path = "../../../../wateros-mm/mm-frame-alloctor", package = "wateros-mm-frame-alloctor", default-features = true }
    logging = { path = "../../../../wateros-runtime/runtime-logging", package = "wateros-runtime-logging", default-features = true }
    mm-api = { path = "../../../../wateros-mm/mm-api/api-v0", package = "wateros-mm-api-v0", default-features = true }
    irq = { path = "../../../../wateros-irq", package = "wateros-irq", default-features = false, features = [
        "riscv-plic",
    ], optional = true }
    task = { path = "../../../../wateros-task", package = "wateros-task", default-features = true, optional = true }
    spin = "0.10.0"
    virtio-drivers = "=0.12.0"

[features]
    api-v0 = [  ]
    default = [ "api-v0" ]
    interrupt = [ "dep:irq", "dep:task" ]
