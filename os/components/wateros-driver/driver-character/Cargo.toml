[package]
    name = "wateros-driver-character"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    character_api_v0 = { path = "./character-api/api-v0/", package = "wateros-driver-character-api-v0", default-features = true }
    driver-api = { path = "../driver-api/api-v0/", package = "wateros-driver-api-v0", default-features = true }
    impl-dummy = { path = "./character-impl/impl-dummy/", package = "wateros-driver-character-impl-dummy", default-features = true }
    impl-rtc-stub = { path = "./character-impl/impl-rtc-stub/", package = "wateros-driver-character-impl-rtc-stub", default-features = true, optional = true }
    impl-null-stub = { path = "./character-impl/impl-null-stub/", package = "wateros-driver-character-impl-null-stub", default-features = true, optional = true }
    impl-uart-16550 = { path = "./character-impl/impl-uart-16550/", package = "wateros-driver-character-impl-uart-16550", default-features = true, optional = true }

[features]
    api-v0 = [
        "impl-dummy/api-v0",
        "impl-null-stub?/api-v0",
        "impl-rtc-stub?/api-v0",
        "impl-uart-16550?/api-v0",
    ]
    default = [ "api-v0", "impl-null-stub", "impl-rtc-stub" ]
    impl-dummy = [  ]
    impl-null-stub = [ "dep:impl-null-stub" ]
    impl-rtc-stub = [ "dep:impl-rtc-stub" ]
    impl-uart-16550 = [ "dep:impl-uart-16550" ]
