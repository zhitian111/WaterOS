[package]
    name = "wateros-driver-character"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./character-api/api-v0/", package = "wateros-driver-character-api-v0", default-features = true }
    impl-dummy = { path = "./character-impl/impl-dummy/", package = "wateros-driver-character-impl-dummy", default-features = true }

[features]
    api-v0 = [ "impl-dummy/api-v0" ]
    default = [ "api-v0", "impl-dummy" ]
    impl-dummy = [  ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
