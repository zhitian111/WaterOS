[package]
name = "wateros-driver-input"
version = "0.1.0"
edition = "2024"

[dependencies]
api-v0 = { path = "./input-api/api-v0", package = "wateros-driver-input-api-v0" }
driver-api = { path = "../driver-api/api-v0", package = "wateros-driver-api-v0" }
impl-virtio-mmio = { path = "./input-impl/impl-virtio-mmio", package = "wateros-driver-input-impl-virtio-mmio", optional = true }
impl-virtio-pci = { path = "./input-impl/impl-virtio-pci", package = "wateros-driver-input-impl-virtio-pci", optional = true }

[features]
default = [ "api-v0" ]
api-v0 = []
impl-virtio-mmio = [ "dep:impl-virtio-mmio" ]
impl-virtio-pci = [ "dep:impl-virtio-pci" ]
