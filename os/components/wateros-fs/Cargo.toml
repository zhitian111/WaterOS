[workspace]
    members = [
        "./fs-api/api-v0/",
        "./fs-impl/impl-ext4-view/",
        "./fs-impl/impl-devfs/",
        "./fs-impl/impl-dummy/",
    ]
[package]
    name = "wateros-fs"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./fs-api/api-v0/", package = "wateros-fs-api-v0", default-features = true }
    impl-dummy = { path = "./fs-impl/impl-dummy/", package = "wateros-fs-impl-dummy", default-features = true }
    impl-devfs = { path = "./fs-impl/impl-devfs/", package = "wateros-fs-impl-devfs", default-features = true }
    impl-ext4-view = { path = "./fs-impl/impl-ext4-view/", package = "wateros-fs-impl-ext4-view", default-features = true }
    log = { version = "0.4.29" }

[features]
    api-v0 = [ "impl-dummy/api-v0", "impl-ext4-view/api-v0" ]
    default = [ "api-v0", "impl-dummy" ]
    impl-devfs = [  ]
    impl-dummy = [  ]
    impl-ext4-view = [  ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
