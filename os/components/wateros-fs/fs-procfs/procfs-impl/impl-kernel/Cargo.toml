[package]
    name = "wateros-fs-procfs-impl-kernel"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "../../procfs-api/api-v0/", package = "wateros-fs-procfs-api-v0", default-features = true }
    fs-api-v0 = { path = "../../../fs-api/api-v0/", package = "wateros-fs-api-v0", default-features = true }
    task = { path = "../../../../wateros-task/", package = "wateros-task", default-features = false}
    cred = { path = "../../../../wateros-cred/", package = "wateros-cred", default-features = true, features = [
        "impl-root",
    ] }
    mm-frame-alloctor = { path = "../../../../wateros-mm/mm-frame-alloctor/", package = "wateros-mm-frame-alloctor", default-features = true }
    driver-block-api-v0 = { path = "../../../../wateros-driver/driver-block/block-api/api-v0", package = "wateros-driver-block-api-v0", default-features = true }
    network = { path = "../../../../wateros-network/", package = "wateros-network", default-features = false, features = [ "impl-smoltcp" ] }
    logging = { path = "../../../../wateros-runtime/runtime-logging", package = "wateros-runtime-logging", default-features = true }
    spin = "0.10.0"

[features]
    api-v0 = [  ]
    self_test = [  ]
    default = [ "api-v0" ]
