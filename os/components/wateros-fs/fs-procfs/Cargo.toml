[package]
    name = "wateros-fs-procfs"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./procfs-api/api-v0/", package = "wateros-fs-procfs-api-v0", default-features = true }
    impl-kernel = { path = "./procfs-impl/impl-kernel/", package = "wateros-fs-procfs-impl-kernel", default-features = true }

[features]
    api-v0 = [ "impl-kernel/api-v0" ]
    default = [ "api-v0", "impl-kernel" ]
    impl-kernel = [  ]
