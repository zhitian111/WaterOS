[package]
    name = "wateros-fs-devfs"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./devfs-api/api-v0/", package = "wateros-fs-devfs-api-v0", default-features = true }
    impl-dummy = { path = "./devfs-impl/impl-dummy/", package = "wateros-fs-devfs-impl-dummy", default-features = true }
    impl-kernel = { path = "./devfs-impl/impl-kernel/", package = "wateros-fs-devfs-impl-kernel", default-features = true }

[features]
    api-v0 = [ "impl-dummy/api-v0", "impl-kernel/api-v0" ]
    default = [ "api-v0", "impl-kernel" ]
    impl-dummy = [  ]
    impl-kernel = [  ]
