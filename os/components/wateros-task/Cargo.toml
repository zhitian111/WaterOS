[workspace]
    members = [ "./task-api/api-v0/", "./task-impl/impl-core/" ]
[package]
    name = "wateros-task"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./task-api/api-v0/", package = "wateros-task-api-v0", default-features = true }
    impl-core = { path = "./task-impl/impl-core/", package = "wateros-task-impl-core", default-features = true }
    riscv = { version = "0.16.0" }
    scheduler = { path = "./task-scheduler/", package = "wateros-task-scheduler", default-features = true }

[features]
    api-v0 = [ "impl-core/api-v0" ]
    default = [ "api-v0", "impl-core" ]
    impl-core = [  ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
