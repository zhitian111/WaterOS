[workspace]
    members = [ "./task-api/api-v0/", "./task-impl/impl-dummy/" ]
[package]
    name = "wateros-task"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./task-api/api-v0/", package = "wateros-task-api-v0", default-features = true }
    impl-dummy = { path = "./task-impl/impl-dummy/", package = "wateros-task-impl-dummy", default-features = true }
    riscv = { version = "0.16.0" }
    scheduler = { path = "./task-scheduler/", package = "wateros-task-scheduler", default-features = true }

[features]
    api-v0 = [ "impl-dummy/api-v0" ]
    default = [ "api-v0", "impl-dummy" ]
    impl-dummy = [  ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
