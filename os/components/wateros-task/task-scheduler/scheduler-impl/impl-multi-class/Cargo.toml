[package]
    name = "wateros-task-scheduler-impl-multi-class"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "../../scheduler-api/api-v0/", package = "wateros-task-scheduler-api-v0", default-features = true }
    arch = { path = "../../../../wateros-platform/platform-arch/", package = "wateros-platform-arch", default-features = false, features = ["api-v0"] }
    base = { path = "../../../../wateros-base/", package = "wateros-base", default-features = true }
    config = { path = "../../../../wateros-base/base-config/", package = "wateros-base-config" }
    log = "0.4"
    platform = { path = "../../../../wateros-platform/", package = "wateros-platform", default-features = false, features = ["api-v0"] }
    task-api = { path = "../../../task-api/api-v0/", package = "wateros-task-api-v0", default-features = true }
    mm-api = { path = "../../../../wateros-mm/mm-api/api-v0/", package = "wateros-mm-api-v0", default-features = true }

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
