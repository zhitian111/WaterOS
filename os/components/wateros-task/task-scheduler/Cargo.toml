[workspace]
    members = [ "./scheduler-api/api-v0/", "./scheduler-impl/impl-dummy/" ]
[package]
    name = "wateros-task-scheduler"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./scheduler-api/api-v0/", package = "wateros-task-scheduler-api-v0", default-features = true }
    impl-dummy = { path = "./scheduler-impl/impl-dummy/", package = "wateros-task-scheduler-impl-dummy", default-features = true }
    task-api = { path = "../task-api/api-v0/", package = "wateros-task-api-v0", default-features = true }

[features]
    api-v0 = [ "impl-dummy/api-v0" ]
    default = [ "api-v0", "impl-dummy" ]
    impl-dummy = [  ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
