[package]
    name = "wateros-runtime-console"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./console-api/api-v0/", package = "wateros-runtime-console-api-v0" }
    impl-dummy = { path = "./console-impl/impl-dummy/", package = "wateros-runtime-console-impl-dummy", optional = true }
    impl-firmware-opensbi = { path = "./console-impl/impl-firmware-opensbi/", package = "wateros-runtime-console-impl-firmware-opensbi", optional = true }
[features]
    api-v0 = [ "impl-dummy?/api-v0", "impl-firmware-opensbi?/api-v0" ]
    default = [ "api-v0", "impl-firmware-opensbi" ]
    impl-dummy = [ "dep:impl-dummy" ]
    impl-firmware-console = [ "dep:impl-firmware-opensbi", "impl-firmware-opensbi/api-v0" ]
    impl-firmware-opensbi = [ "impl-firmware-console" ]
