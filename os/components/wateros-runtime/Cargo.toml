[workspace]
    members = [
        "./runtime-console/console-api/api-v0/",
        "./runtime-console/console-impl/impl-dummy/",
        "./runtime-console/console-impl/impl-platform-console/",
        "./runtime-logging/",
        "./runtime-panic/",
        "runtime-console",
        "runtime-heap-allocator",
        "runtime-serial",
    ]
[package]
    name = "wateros-runtime"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    panic = { path = "./runtime-panic/", package = "wateros-runtime-panic", default-features = false }
    console = { path = "./runtime-console/", package = "wateros-runtime-console", default-features = false }
    logging = { path = "./runtime-logging/", package = "wateros-runtime-logging", default-features = false }
    heap-allocator = { path = "./runtime-heap-allocator/", package = "wateros-runtime-heap-allocator", default-features = true }
    runtime-serial = { path = "./runtime-serial/", package = "wateros-runtime-serial", default-features = true, optional = true }

[features]
    default = [  ]
    impl-debug = [ "logging/impl-debug" ]
    impl-dummy = [
        "console/impl-dummy",
        "logging/impl-dummy",
        "panic/impl-dummy",
    ]
    impl-error = [ "logging/impl-error" ]
    impl-platform-console = [
        "console/impl-platform-console",
        "logging/impl-platform-console",
        "panic/impl-platform-console",
    ]
    impl-info = [ "logging/impl-info" ]
    impl-trace = [ "logging/impl-trace" ]
    impl-warn = [ "logging/impl-warn" ]
    # QEMU virt UART0 MMIO + SerialPort，供伪 shell（依赖 wateros-driver）。
    serial-uart-virt = [ "dep:runtime-serial" ]
