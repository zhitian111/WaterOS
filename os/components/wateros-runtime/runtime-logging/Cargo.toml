[package]
    name = "wateros-runtime-logging"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    log = { version = "0.4.29" }
    console = { path = "../runtime-console/", package = "wateros-runtime-console", default-features = false }
    platform = { path = "../../wateros-platform/", package = "wateros-platform", default-features = false, features = [ "api-v0" ], optional = true }
[features]
    default = [  ]
    impl-debug = [  ]
    impl-error = [  ]
    impl-info = [  ]
    impl-platform-console = [ "console/impl-platform-console", "dep:platform" ]
    impl-trace = [  ]
    impl-warn = [  ]
