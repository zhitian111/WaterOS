[workspace]
    members = [ "./klog-api/api-v0/", "./klog-impl/impl-kernel/" ]

[package]
    name = "wateros-klog"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./klog-api/api-v0/", package = "wateros-klog-api-v0", default-features = true }
    impl-kernel = { path = "./klog-impl/impl-kernel/", package = "wateros-klog-impl-kernel", default-features = true }

[features]
api-v0 = []
default = [ "api-v0", "impl-kernel" ]
impl-kernel = []

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
