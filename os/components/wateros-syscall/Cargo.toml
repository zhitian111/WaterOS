[workspace]

[package]
    name = "wateros-syscall"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    abi = { path = "../wateros-abi/", package = "wateros-abi", default-features = false }
    task = { path = "../wateros-task/", package = "wateros-task", default-features = false }
    ipc = { path = "../wateros-ipc/", package = "wateros-ipc", default-features = true }
    base = { path = "../wateros-base/", package = "wateros-base", default-features = true }
    mm = { path = "../wateros-mm/", package = "wateros-mm", default-features = true }
    vfs = { path = "../wateros-vfs/", package = "wateros-vfs", default-features = false, optional = true }

[features]
    default = []
    fd-session = [
        "dep:vfs",
        "vfs/fd-session",
    ]
    impl-loongarch64 = [
        "default",
        "fd-session",
        "vfs/impl-loongarch64",
        "abi/api-v0",
        "abi/impl-linux-loongarch64",
        "ipc/impl-loongarch64",
        "ipc/pipe",
        "task/api-v0",
        "task/impl-core",
        "task/impl-loongarch64",
        "task/impl-round-robin",
    ]
    impl-riscv64 = [
        "default",
        "fd-session",
        "vfs/impl-riscv64",
        "abi/api-v0",
        "abi/impl-linux-riscv64",
        "ipc/impl-riscv64",
        "ipc/pipe",
        "task/api-v0",
        "task/impl-core",
        "task/impl-riscv64",
        "task/impl-round-robin",
    ]

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
