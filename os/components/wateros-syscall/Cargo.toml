[workspace]
    members = [ "./syscall-api/api-v0/", "./syscall-impl/impl-kernel/" ]

[patch.crates-io]
    virtio-drivers = { path = "../../vendor/virtio-drivers" }

[package]
    name = "wateros-syscall"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "./syscall-api/api-v0/", package = "wateros-syscall-api-v0", default-features = true, optional = true }
    impl-kernel = { path = "./syscall-impl/impl-kernel/", package = "wateros-syscall-impl-kernel", default-features = false, optional = true }
    log = { version = "0.4" }

[features]
    api-v0 = [ "dep:api-v0", "impl-kernel?/api-v0" ]
    bringup-stats = [ "impl-kernel?/bringup-stats" ]
    default = [ "impl-kernel" ]
    impl-kernel = [ "api-v0", "dep:impl-kernel", "impl-kernel/impl-kernel" ]
    ipv6 = [ "impl-kernel?/ipv6" ]
    self_test = [ "impl-kernel", "impl-kernel/self_test" ]
    user-copy-diagnostics = [ "impl-kernel?/user-copy-diagnostics" ]
[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"
