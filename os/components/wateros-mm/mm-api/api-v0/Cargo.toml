[package]
    name = "wateros-mm-api-v0"
    version = "0.1.0"
    edition = "2024"

[dependencies]
frame_alloctor_api_v0 = { path = "../../mm-frame-alloctor/frame-alloctor-api/api-v0/", package = "wateros-mm-frame-alloctor-api-v0", default-features = true }
base = { path = "../../../wateros-base/", package = "wateros-base", default-features = true }
log = { version = "0.4.29" }
spin = "0.10"

[features]
default = []
# Loongson 2K1000 LA264 has UAL disabled; keep this marker at the API layer so
# the initial user ABI (including AT_HWCAP) can follow the selected board.
loongson2k1000la = []
