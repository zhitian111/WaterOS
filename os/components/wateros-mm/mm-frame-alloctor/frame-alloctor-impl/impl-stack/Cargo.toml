[package]
    name = "wateros-mm-frame-alloctor-impl-stack"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    api-v0 = { path = "../../frame-alloctor-api/api-v0/", package = "wateros-mm-frame-alloctor-api-v0", default-features = true }
    mm-api = { path = "../../../mm-api/api-v0", package = "wateros-mm-api-v0", default-features = true }
    wateros-base = { path = "../../../../wateros-base", package = "wateros-base", default-features = true }
    arch = { path = "../../../../wateros-platform/platform-arch/", package = "wateros-platform-arch", default-features = false, optional = true, features = [
        "api-v0",
    ] }
    log = { version = "0.4.29" }
    debug = { path = "../../../../wateros-debug/", package = "wateros-debug", default-features = false }

[features]
    api-v0 = [  ]
    kernel-arch = [ "dep:arch" ]
    default = [ "api-v0", "kernel-arch" ]
