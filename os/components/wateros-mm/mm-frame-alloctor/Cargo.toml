[package]
    name = "wateros-mm-frame-alloctor"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    impl-dummy = { path = "./frame-alloctor-impl/impl-dummy/", package = "wateros-mm-frame-alloctor-impl-dummy" }
    impl-stack = { path = "./frame-alloctor-impl/impl-stack/", package = "wateros-mm-frame-alloctor-impl-stack" }
    api-v0 = { path = "./frame-alloctor-api/api-v0/", package = "wateros-mm-frame-alloctor-api-v0" }
    wateros-base = { path = "../../wateros-base", package = "wateros-base", default-features = true }
    log = { version = "0.4.29" }

[features]
    api-v0 = [ "impl-stack/api-v0" ]
    default = [ "api-v0", "impl-stack" ]
    impl-dummy = [  ]
    impl-stack = [  ]
