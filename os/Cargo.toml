[package]
    name = "wateros"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    abi = { package = "wateros-abi", path = "./components/wateros-abi/", default-features = true }
    base = { package = "wateros-base", path = "./components/wateros-base/", default-features = true }
    fs = { package = "wateros-fs", path = "./components/wateros-fs/", default-features = false, optional = true }
    vfs = { package = "wateros-vfs", path = "./components/wateros-vfs/", default-features = false, optional = true }
    platform = { package = "wateros-platform", path = "./components/wateros-platform/", default-features = false }
    utils = { package = "wateros-utils", path = "./components/wateros-utils/", default-features = false, optional = true }
    driver = { package = "wateros-driver", path = "./components/wateros-driver/", default-features = false, optional = true }
    ipc = { package = "wateros-ipc", path = "./components/wateros-ipc/", default-features = false, optional = true }
    runtime = { package = "wateros-runtime", path = "./components/wateros-runtime/", default-features = false }
    mm = { package = "wateros-mm", path = "./components/wateros-mm/", default-features = false, optional = true }
    syscall = { package = "wateros-syscall", path = "./components/wateros-syscall/", default-features = false, optional = true }
    task = { package = "wateros-task", path = "./components/wateros-task/", default-features = false, optional = true }

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"

[features]
    default = [ "qemu-riscv64-opensbi" ]
    qemu-loongarch64-virt = [
        "platform/impl-qemu-loongarch64-virt",
        "runtime/impl-debug",
        "runtime/impl-firmware-console",
    ]
    qemu-riscv64-opensbi = [
        "dep:driver",
        "dep:fs",
        "dep:ipc",
        "dep:mm",
        "dep:syscall",
        "dep:task",
        "dep:utils",
        "dep:vfs",
        "driver/impl-qemu-riscv64-opensbi",
        "mm/impl-sv39",
        "platform/impl-qemu-riscv64-opensbi",
        "runtime/impl-firmware-opensbi",
        "syscall/impl-riscv64",
        "task/impl-core",
        "task/impl-riscv64",
        "task/impl-round-robin",
    ]
