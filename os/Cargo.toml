[package]
    name = "wateros"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    arch_api_v0 = { package = "wateros-platform-arch-api-v0", path = "./components/wateros-platform/platform-arch/arch-api/api-v0/", default-features = true }
    abi = { package = "wateros-abi", path = "./components/wateros-abi/", default-features = false }
    base = { package = "wateros-base", path = "./components/wateros-base/", default-features = true }
    base_config = { package = "wateros-base-config", path = "./components/wateros-base/base-config/", default-features = true }
    fs = { package = "wateros-fs", path = "./components/wateros-fs/", default-features = true, optional = true }
    vfs = { package = "wateros-vfs", path = "./components/wateros-vfs/", default-features = true, optional = true }
    platform = { package = "wateros-platform", path = "./components/wateros-platform/", default-features = false }
    utils = { package = "wateros-utils", path = "./components/wateros-utils/", default-features = true }
    driver = { package = "wateros-driver", path = "./components/wateros-driver/", default-features = false, optional = true }
    ipc = { package = "wateros-ipc", path = "./components/wateros-ipc/", default-features = false, optional = true }
    runtime = { package = "wateros-runtime", path = "./components/wateros-runtime/", default-features = false }
    mm = { package = "wateros-mm", path = "./components/wateros-mm/", default-features = false }
    cred = { package = "wateros-cred", path = "./components/wateros-cred/", default-features = true, optional = true }
    syscall = { package = "wateros-syscall", path = "./components/wateros-syscall/", default-features = false }
    klog = { package = "wateros-klog", path = "./components/wateros-klog/", default-features = false, optional = true }
    task = { package = "wateros-task", path = "./components/wateros-task/", default-features = true }
    fdt = { version = "0.1.5", optional = true }

# 使用本地 vendor 的 ext4plus（修复了块分配器在 block group
# 空闲块够但无连续段时 find_first / find_first_n 返回 None 后
# 不推进 bg_id 导致的死循环；见 os/vendor/ext4plus/src/lib.rs）。
[patch.crates-io]
    ext4_rs = { path = "vendor/ext4_rs" }
    ext4plus = { path = "vendor/ext4plus" }

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"

[features]
    default = [ "qemu-riscv64-opensbi" ]
    # 比赛阶段决定根镜像中的用户态 bring-up 队列。
    pre = [  ]
    final_online = [  ]
    final_online_smp_test = [ "final_online" ]
    impl-sv39 = [ "mm/impl-sv39" ]
    qemu-loongarch64-virt = [
        "abi/impl-linux-generic64",
        "dep:cred",
        "dep:driver",
        "dep:fdt",
        "dep:fs",
        "dep:ipc",
        "driver/impl-block-cache",
        "driver/impl-qemu-loongarch64-virt",
        "ipc/all",
        "mm/impl-loongarch64",
        "mm/vfs-root-read",
        "platform/impl-qemu-loongarch64-virt",
        # "runtime/impl-trace",
        # "runtime/impl-info",
        # "runtime/impl-debug",
        # "runtime/impl-warn",
        "runtime/impl-error",
        "dep:klog",
        "klog/default",
        "runtime/impl-platform-console",
        "syscall/impl-kernel",
        "vfs-bridge",
    ]
    vfs-bridge = [ "dep:vfs" ]
    # LTP 并行跑测：busybox bringup 仅跑单个 ltp_testcode.sh
    bringup-ltp-glibc-only = [  ]
    bringup-ltp-musl-only = [  ]
    # 热路径 syscall/trap 参数跟踪（默认关闭；见 trap_handler hot_syscall_trace!）
    qemu-riscv64-opensbi = [
        "abi/impl-linux-generic64",
        "dep:cred",
        "dep:driver",
        "dep:fdt",
        "dep:fs",
        "dep:ipc",
        "driver/impl-block-cache",
        "driver/impl-qemu-riscv64-opensbi",
        "ipc/all",
        "vfs-bridge",
        # 根 crate 的 `impl-sv39`：其它 crate（如 `task`）里 `#[cfg(feature = "impl-sv39")]` 依赖此 flag。
        "impl-sv39",
        "mm/vfs-root-read",
        "platform/impl-qemu-riscv64-opensbi",
        # "runtime/impl-trace",
        "runtime/impl-info",
        # "runtime/impl-warn",
        "runtime/impl-error",
        "dep:klog",
        "klog/default",
        "runtime/impl-platform-console",
        "syscall/impl-kernel",
    ]
    syscall-trace = [  ]
