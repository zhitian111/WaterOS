[package]
    name = "wateros"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    arch_api_v0 = { package = "wateros-platform-arch-api-v0", path = "./components/wateros-platform/platform-arch/arch-api/api-v0/", default-features = true }
    abi = { package = "wateros-abi", path = "./components/wateros-abi/", default-features = true }
    base = { package = "wateros-base", path = "./components/wateros-base/", default-features = true }
    fs = { package = "wateros-fs", path = "./components/wateros-fs/", default-features = true }
    vfs = { package = "wateros-vfs", path = "./components/wateros-vfs/", default-features = true }
    platform = { package = "wateros-platform", path = "./components/wateros-platform/", default-features = true }
    utils = { package = "wateros-utils", path = "./components/wateros-utils/", default-features = true }
    driver = { package = "wateros-driver", path = "./components/wateros-driver/", default-features = true }
    ipc = { package = "wateros-ipc", path = "./components/wateros-ipc/", default-features = true }
    runtime = { package = "wateros-runtime", path = "./components/wateros-runtime/", default-features = true }
    mm = { package = "wateros-mm", path = "./components/wateros-mm/", default-features = true }
    syscall = { package = "wateros-syscall", path = "./components/wateros-syscall/", default-features = true }
    task = { package = "wateros-task", path = "./components/wateros-task/", default-features = true }
    riscv = { version = "0.16.0" }

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"

[features]
    default = [ "impl-sv39", "qemu-riscv64-opensbi", "vfs-bridge" ]
    qemu-riscv64-opensbi = [
        "platform/impl-qemu-riscv64-opensbi",
        "vfs-bridge",
        "mm/qemu-riscv64-opensbi",
    ]
    vfs-bridge = [ "vfs/bridge-fs-api" ]
    impl-sv39 = [ "mm/impl-sv39" ]
