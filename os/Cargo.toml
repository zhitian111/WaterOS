[package]
    name = "wateros"
    version = "0.1.0"
    edition = "2024"

[dependencies]
    arch_api_v0 = { package = "wateros-platform-arch-api-v0", path = "./components/wateros-platform/platform-arch/arch-api/api-v0/", default-features = true }
    abi = { package = "wateros-abi", path = "./components/wateros-abi/", default-features = false }
    base = { package = "wateros-base", path = "./components/wateros-base/", default-features = true }
    fs = { package = "wateros-fs", path = "./components/wateros-fs/", default-features = false, optional = true }
    vfs = { package = "wateros-vfs", path = "./components/wateros-vfs/", default-features = false, optional = true }
    platform = { package = "wateros-platform", path = "./components/wateros-platform/", default-features = false }
    utils = { package = "wateros-utils", path = "./components/wateros-utils/", default-features = true }
    driver = { package = "wateros-driver", path = "./components/wateros-driver/", default-features = false, optional = true }
    ipc = { package = "wateros-ipc", path = "./components/wateros-ipc/", default-features = false, optional = true }
    runtime = { package = "wateros-runtime", path = "./components/wateros-runtime/", default-features = false }
    pseudo_shell = { package = "wateros-pseudo-shell", path = "./components/wateros-pseudo-shell/", default-features = true, optional = true }
    mm = { package = "wateros-mm", path = "./components/wateros-mm/", default-features = false, optional = true }
    cred = { package = "wateros-cred", path = "./components/wateros-cred/", default-features = false, optional = true }
    syscall = { package = "wateros-syscall", path = "./components/wateros-syscall/", default-features = false }
    task = { package = "wateros-task", path = "./components/wateros-task/", default-features = false }

[profile.dev]
    panic = "abort"

[profile.release]
    panic = "abort"

[features]
    default = [ "qemu-riscv64-opensbi" ]
    fd-session = [ "vfs/fd-session" ]
    impl-loongarch64 = [ "mm/impl-loongarch64" ]
    impl-sv39 = [ "mm/impl-sv39" ]
    qemu-loongarch64-virt = [
        "abi/impl-linux-loongarch64",
        "cred/api-v0",
        "cred/impl-root",
        "dep:cred",
        "dep:driver",
        "dep:fs",
        "dep:ipc",
        "dep:mm",
        "dep:vfs",
        "driver/impl-qemu-loongarch64-virt",
        "fd-session",
        "fs/api-v0",
        "fs/impl-devfs",
        "fs/impl-ext4",
        "impl-loongarch64",
        "ipc/impl-loongarch64",
        "ipc/pipe",
        "mm/api-v0",
        "mm/impl-loongarch64",
        "mm/vfs-root-read",
        "platform/impl-qemu-loongarch64-virt",
        "runtime/impl-firmware-console",
        "runtime/impl-info",
        "syscall/impl-loongarch64",
        "task/api-v0",
        "task/impl-core",
        "task/impl-round-robin",
        "vfs-bridge",
        "vfs/impl-loongarch64",
    ]
    vfs-bridge = [ "vfs/bridge-fs-api" ]
    # 启用阻塞式伪 shell：`pseudo_shell::run_pseudo_shell`；需自行在合适上下文调用。
    pseudo-shell = [ "dep:pseudo_shell" ]
    qemu-riscv64-opensbi = [
        "dep:driver",
        "dep:fs",
        "dep:ipc",
        "dep:mm",
        # "dep:utils",
        "abi/api-v0",
        "cred/api-v0",
        "cred/impl-root",
        "dep:cred",
        "dep:vfs",
        "driver/impl-qemu-riscv64-opensbi",
        "fd-session",
        "fs/api-v0",
        "fs/impl-devfs",
        "fs/impl-ext4",
        "ipc/api-v0",
        "ipc/impl-dummy",
        "ipc/impl-riscv64",
        "ipc/pipe",
        "vfs-bridge",
        # 根 crate 的 `impl-sv39`：其它 crate（如 `task`）里 `#[cfg(feature = "impl-sv39")]` 依赖此 flag。
        "impl-sv39",
        "mm/api-v0",
        "mm/impl-sv39",
        "mm/vfs-root-read",
        "platform/impl-qemu-riscv64-opensbi",
        "runtime/impl-firmware-opensbi",
        "runtime/impl-trace",
        "abi/impl-linux-riscv64",
        "fd-session",
        "runtime/impl-info",
        "syscall/impl-riscv64",
        "task/api-v0",
        "task/impl-core",
        "task/impl-round-robin",
        "vfs/impl-riscv64",
    ]
